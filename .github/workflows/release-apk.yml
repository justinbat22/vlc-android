# Place at: .github/workflows/release-apk.yml
#
# Manual-only release build. Click "Run workflow" in the Actions tab, then pick:
#   - version:         YOUR build version, e.g. 1.22.0 (a leading "v" is optional). It is not VLC's
#                      version: it names the APKs, the GitHub release and its tag.
#   - abi:             all (default) or one of arm64-v8a / armeabi-v7a / x86_64 / x86
#   - publish_release: tick to also publish the APK(s) on the repo's Releases page
#
# Version 1.22.0 gives:
#   APK      vlc-android-fork-v1.22.0-arm64-v8a.apk  (one per ABI)
#   Release  "VLC Android Fork v1.22.0", tag v1.22.0
#
# The APK is always uploaded as a workflow artifact too (kept 30 days).
name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Your build version, e.g. 1.22.0 (names the APKs, the release and its tag)"
        type: string
        required: true
      abi:
        description: "ABI to build (all = every ABI)"
        type: choice
        default: all
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
      publish_release:
        description: "Publish to the GitHub Releases page"
        type: boolean
        default: false

permissions:
  contents: write   # only used when publish_release is ticked

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ABI: ${{ inputs.abi }}
      BUILD_TOOLS: 36.0.0
      PUBLISH: ${{ inputs.publish_release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Fail in seconds, not after a 30 minute build: bad version, or a release that already exists.
      - name: Check version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION//[[:space:]]/}"
          VERSION="${VERSION#[vV]}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}([-+][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$INPUT_VERSION'. Use something like 1.22.0 or 1.22.0-beta1."
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists. Pick a new version or delete that release first."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building version ${VERSION}"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;${BUILD_TOOLS}"

      - name: local.properties + libvlcjni stub
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p libvlcjni/libvlc

      # IMPORTANT: run it as `-p application/app assembleRelease`, not `:application:app:assembleRelease`.
      # application/app/build.gradle only enables per-ABI APK splits when a task name matches
      # "assemble*Release" exactly, and a ":path:" prefix would break that match.
      # `-p` also avoids building the medialibrary/libvlc modules, which would need libvlcjni.
      - name: Build release APKs (unsigned)
        run: gradle -p application/app assembleRelease --stacktrace

      # Gradle names the APKs VLC-Android-<official version>-<abi>.apk. Keep the wanted ABI(s) and
      # give them the fork's name: vlc-android-fork-v<version>-<abi>.apk
      - name: Pick ABI and name the APKs
        run: |
          mkdir -p unsigned
          for f in $(find application/app/build/outputs/apk/release -name '*.apk'); do
            abi="$(basename "$f" | sed -nE 's/.*-(armeabi-v7a|arm64-v8a|x86_64|x86|all)\.apk$/\1/p')"
            [ -n "$abi" ] || { echo "::warning::Skipping $(basename "$f"): unknown ABI"; continue; }
            if [ "$ABI" != "all" ] && [ "$abi" != "$ABI" ]; then continue; fi
            cp "$f" "unsigned/vlc-android-fork-v${VERSION}-${abi}.apk"
          done
          ls -lh unsigned
          [ -n "$(ls unsigned/*.apk 2>/dev/null)" ] || { echo "::error::No APK for ABI '$ABI'"; exit 1; }

      # Release APKs come out unsigned and cannot be installed. Sign them.
      # Add these repo secrets once to get a stable key (needed to update over a previous install):
      #   KEYSTORE_BASE64   base64 -w0 your.jks
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD      (optional, defaults to KEYSTORE_PASSWORD)
      # Without them a throw-away key is generated: the APK installs, but each build has a different
      # signature, so you must uninstall the previous build first.
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No signing secrets found - using a throw-away key (see comments in this workflow)."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"; KEY_PASSWORD="$KEYSTORE_PASSWORD"; KEY_ALIAS=release
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=VLC fork build"
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          mkdir -p out
          for f in unsigned/*.apk; do
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --out "out/$(basename "$f")" "$f"
            "$APKSIGNER" verify "out/$(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-android-fork-v${{ env.VERSION }}-${{ inputs.abi }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "VLC Android Fork v${VERSION}" \
            --notes "Version ${VERSION}. Commit ${GITHUB_SHA}. ABI: ${ABI}."

      - name: Build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore
