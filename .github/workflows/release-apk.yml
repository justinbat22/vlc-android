# Place at: .github/workflows/release-apk.yml
#
# Manual-only release build. Click "Run workflow" in the Actions tab, then pick:
#   - abi:             all (default) or one of arm64-v8a / armeabi-v7a / x86_64 / x86
#   - publish_release: tick to also publish the APK(s) on the repo's Releases page
#
# The APK is always uploaded as a workflow artifact too (kept 30 days).
name: Release APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI to build (all = every ABI)"
        type: choice
        default: all
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
      publish_release:
        description: "Publish to the GitHub Releases page"
        type: boolean
        default: false

permissions:
  contents: write   # only used when publish_release is ticked

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ABI: ${{ inputs.abi }}
      BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;${BUILD_TOOLS}"

      - name: local.properties + libvlcjni stub
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p libvlcjni/libvlc

      # IMPORTANT: run it as `-p application/app assembleRelease`, not `:application:app:assembleRelease`.
      # application/app/build.gradle only enables per-ABI APK splits when a task name matches
      # "assemble*Release" exactly, and a ":path:" prefix would break that match.
      # `-p` also avoids building the medialibrary/libvlc modules, which would need libvlcjni.
      - name: Build release APKs (unsigned)
        run: gradle -p application/app assembleRelease --stacktrace

      - name: Pick ABI
        run: |
          mkdir -p unsigned
          find application/app/build/outputs/apk/release -name '*.apk' -exec cp {} unsigned/ \;
          if [ "$ABI" != "all" ]; then
            find unsigned -name '*.apk' ! -name "*-${ABI}.apk" -delete
          fi
          ls -lh unsigned
          [ -n "$(ls unsigned/*.apk 2>/dev/null)" ] || { echo "::error::No APK for ABI '$ABI'"; exit 1; }

      # Release APKs come out unsigned and cannot be installed. Sign them.
      # Add these repo secrets once to get a stable key (needed to update over a previous install):
      #   KEYSTORE_BASE64   base64 -w0 your.jks
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD      (optional, defaults to KEYSTORE_PASSWORD)
      # Without them a throw-away key is generated: the APK installs, but each build has a different
      # signature, so you must uninstall the previous build first.
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No signing secrets found - using a throw-away key (see comments in this workflow)."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"; KEY_PASSWORD="$KEYSTORE_PASSWORD"; KEY_ALIAS=release
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=VLC fork build"
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          mkdir -p out
          for f in unsigned/*.apk; do
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --out "out/$(basename "$f")" "$f"
            "$APKSIGNER" verify "out/$(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-release-${{ inputs.abi }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "VLC Android fork - build ${GITHUB_RUN_NUMBER} (${ABI})" \
            --notes "Commit ${GITHUB_SHA}. ABI: ${ABI}."

      - name: Build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore
