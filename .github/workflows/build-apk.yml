name: Build APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "Gradle task"
        default: ":application:app:assembleDebug"
        required: true

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17            # AGP 9.1.x minimum

      # Same version buildsystem/compile.sh uses. The repo has no gradlew (git-ignored).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # root build.gradle loads local.properties unconditionally
      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # settings.gradle includes :libvlcjni:libvlc (a folder compile.sh normally clones).
      # Gradle 9 needs the directory to exist; debug builds never use it.
      - name: Stub libvlcjni
        run: mkdir -p libvlcjni/libvlc

      - name: Build
        run: gradle "${{ github.event.inputs.gradle_task || ':application:app:assembleDebug' }}" --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find application/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
          
